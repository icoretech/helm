{{- if .Values.secrets.create }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "codex-pooler.secretName" . }}
  labels:
    {{- include "codex-pooler.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{- include "codex-pooler.secretData" . | nindent 2 }}
{{- if .Values.migrations.enabled }}
---
# The migration Job is a pre-install/pre-upgrade hook, and Helm runs hooks before
# it applies the release manifests. The Secret above is a manifest, so on a fresh
# install it does not exist yet when the hook starts: the Job would fail with
# `secret "…" not found` before the release ever comes up.
#
# This copy is a hook too, with a lower weight than the Job, so Helm creates it
# first and deletes it again once the hook phase succeeds. The Secret the
# workloads mount keeps its ordinary release lifecycle — visible in
# `helm get manifest`, rolled back with the release, removed by `helm uninstall`.
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "codex-pooler.migrationsSecretName" . }}
  labels:
    {{- include "codex-pooler.labels" . | nindent 4 }}
    app.kubernetes.io/component: migrations
  annotations:
    helm.sh/hook: pre-install,pre-upgrade
    helm.sh/hook-weight: "-10"
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
type: Opaque
stringData:
  {{- include "codex-pooler.secretData" . | nindent 2 }}
{{- end }}
{{- end }}
