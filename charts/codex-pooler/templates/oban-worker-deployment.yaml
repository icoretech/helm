{{- include "codex-pooler.validateObanTopology" . }}
{{- if .Values.oban.worker.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "codex-pooler.fullname" . }}-oban-worker
  labels:
    {{- include "codex-pooler.labels" . | nindent 4 }}
    app.kubernetes.io/component: oban-worker
spec:
  replicas: {{ .Values.oban.worker.replicaCount }}
  revisionHistoryLimit: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: {{ .Values.oban.worker.strategy.maxUnavailable }}
      maxSurge: {{ .Values.oban.worker.strategy.maxSurge }}
  selector:
    matchLabels:
      {{- include "codex-pooler.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: oban-worker
  template:
    metadata:
      labels:
        {{- include "codex-pooler.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: oban-worker
        {{- if and .Values.clustering.enabled .Values.clustering.participants.worker }}
        {{- include "codex-pooler.clusteringMemberLabel" . | nindent 8 }}
        {{- end }}
      {{- $runtimePodAnnotations := include "codex-pooler.runtimePodAnnotations" (dict "root" . "podAnnotations" .Values.oban.worker.podAnnotations) | trim }}
      {{- if $runtimePodAnnotations }}
{{ $runtimePodAnnotations | nindent 6 }}
      {{- end }}
    spec:
      {{- if and .Values.clustering.enabled .Values.clustering.participants.worker }}
      subdomain: {{ include "codex-pooler.clusteringHeadlessServiceName" . }}
      {{- end }}
      terminationGracePeriodSeconds: {{ .Values.oban.worker.terminationGracePeriodSeconds }}
      serviceAccountName: {{ include "codex-pooler.serviceAccountName" . }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: oban-worker
          image: {{ include "codex-pooler.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          {{- if and .Values.clustering.enabled .Values.clustering.participants.worker }}
          ports:
            - name: epmd
              containerPort: {{ .Values.clustering.epmdPort }}
            - name: distribution
              containerPort: {{ .Values.clustering.distributionPort }}
          {{- end }}
          env:
            - name: OBAN_MODE
              value: worker
            {{- include "codex-pooler.clusteringEnv" (dict "root" . "role" "worker") | nindent 12 }}
            - name: CODEX_POOLER_POD_UID
              valueFrom:
                fieldRef:
                  fieldPath: metadata.uid
            - name: CODEX_POOLER_INSTANCE_SLOT_ID
              value: "$(CODEX_POOLER_POD_UID)/oban-worker"
            {{- include "codex-pooler.env" . | nindent 12 }}
          # `rollout status` on these Deployments used to mean nothing: with no
          # probe at all, a worker reported Ready against a database with no
          # schema. This probe reports readiness; it cannot prevent queue or plugin
          # startup. Images containing Platform.JobRuntime independently refuse
          # Oban startup until their required schema is applied, and may restart
          # while migrations are pending. Older images lack that startup gate.
          # `rpc` spawns a BEAM per call, hence the slow cadence and the
          # generous timeout; `ERL_AFLAGS=` clears inherited flags the same way
          # the app's preStop command does.
          #
          # Images exporting readiness_check/0 verify their complete required
          # migration set; older images fall back to at least one applied row.
          # Neither probe prevents background startup in an image without the
          # independent JobRuntime gate. Both arms raise on failure because
          # `rpc` discards return values and would otherwise exit successfully.
          #
          # `Code.ensure_loaded?` first: `function_exported?/3` answers false for
          # a module that is merely not loaded, which would route to the weaker
          # arm for the wrong reason.
          readinessProbe:
            exec:
              command:
                - /bin/sh
                - -ec
                - 'ERL_AFLAGS= timeout 9s /app/bin/codex_pooler rpc "if Code.ensure_loaded?(CodexPooler.Release) and function_exported?(CodexPooler.Release, :readiness_check, 0), do: CodexPooler.Release.readiness_check(), else: ([_ | _] = Ecto.Adapters.SQL.query!(CodexPooler.Repo, ~s(select true from schema_migrations limit 1), []).rows)"'
            initialDelaySeconds: 20
            periodSeconds: 30
            timeoutSeconds: 10
            failureThreshold: 3
          resources:
            {{- toYaml .Values.oban.worker.resources | nindent 12 }}
      {{- with .Values.oban.worker.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.oban.worker.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.oban.worker.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end }}
