{{- if .Values.migrations.enabled }}
# Deliberately not a Helm hook. A pre-install hook runs before the release
# manifests exist, so it cannot read a Secret this chart creates; giving it a
# copy of that Secret left secret material in the namespace whenever the hook
# phase was interrupted, with nothing owning it. As a release manifest the Job
# is created after the Secret (Helm orders Secret before Job), belongs to the
# release, is visible in `helm get manifest`, and goes away with it.
#
# Ordering for the workloads is enforced where it belongs: every role's
# readiness probe asks the release whether the schema is usable, so a pod cannot
# serve ahead of the migration it needs. The name carries the release revision
# because a Job's pod template is immutable and every upgrade renders a new one.
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "codex-pooler.migrationJobName" . }}
  labels:
    {{- include "codex-pooler.labels" . | nindent 4 }}
    app.kubernetes.io/component: migrations
spec:
  ttlSecondsAfterFinished: {{ .Values.migrations.ttlSecondsAfterFinished }}
  # A migration that cannot start — a missing Secret key, an unreachable
  # database — must fail the release instead of sitting active forever and
  # hanging `helm install` until the client timeout.
  backoffLimit: {{ .Values.migrations.backoffLimit }}
  activeDeadlineSeconds: {{ .Values.migrations.activeDeadlineSeconds }}
  template:
    metadata:
      labels:
        {{- include "codex-pooler.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: migrations
    spec:
      restartPolicy: OnFailure
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: migrations
          image: {{ include "codex-pooler.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: ["/bin/sh", "-lc"]
          args:
            - |
              set -e
              /app/bin/codex_pooler eval "CodexPooler.Release.migrate()"
              /app/bin/codex_pooler eval "CodexPooler.Release.import_openai_pricing_from_priv()"
          env:
            - name: OBAN_MODE
              value: web
            # Keep lock contention inside the Job's total budget while leaving
            # one minute for execution. Long migrations can still exhaust the
            # Job deadline; this is a bounded contention allowance, not a promise
            # that every possible migration duration fits.
            - name: MIGRATION_ADVISORY_LOCK_WAIT_SECONDS
              value: {{ min 600 (sub (int .Values.migrations.activeDeadlineSeconds) 60) | quote }}
            - name: CODEX_POOLER_POD_UID
              valueFrom:
                fieldRef:
                  fieldPath: metadata.uid
            - name: CODEX_POOLER_INSTANCE_SLOT_ID
              value: "$(CODEX_POOLER_POD_UID)/migrations"
            {{- include "codex-pooler.env" . | nindent 12 }}
          resources:
            {{- toYaml .Values.migrations.resources | nindent 12 }}
{{- end }}
