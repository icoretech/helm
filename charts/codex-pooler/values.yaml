nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: true
  annotations: {}
  name: ""

podAnnotations: {}
imagePullSecrets: []

image:
  repository: ghcr.io/icoretech/codex-pooler
  # -- Image tag. Defaults to the chart appVersion when empty.
  tag: ""
  pullPolicy: IfNotPresent

ingress:
  enabled: false
  className: ""
  annotations: {}
  hosts:
    - host: codex-pooler.example.com
      paths:
        - path: /
          pathType: Prefix
  tls: []

config:
  host: codex-pooler.example.com
  port: 4000
  poolSize: 10
  ectoIpv6: "false"
  obanJobsQueueLimit: "8"
  obanShutdownGracePeriodMs: "55000"
  lang: "C.UTF-8"
  lcAll: "C.UTF-8"
  # -- Bound ERTS port-table capacity independently of a container's file-descriptor rlimit.
  erlMaxPorts: "1048576"

monitoring:
  serviceMonitor:
    enabled: false
    labels: {}
    annotations: {}
    interval: 30s
    scrapeTimeout: 10s
    path: /metrics
    scheme: http
    bearerTokenSecret:
      name: ""
      key: ""
    metricRelabelings: []
    relabelings: []

clustering:
  enabled: false
  query: ""
  distributionPort: "9000"
  epmdPort: "4369"
  headlessService:
    enabled: true
    nameOverride: ""
    publishNotReadyAddresses: true
  cookie:
    existingSecret: ""
    existingSecretKey: release-cookie
    value: ""
  participants:
    app: true
    worker: true
    scheduler: true

secrets:
  create: false
  existingSecret: codex-pooler-secrets
  databaseUrl: ""
  secretKeyBase: ""
  totpEncryptionKey: ""
  totpKeyVersion: v1
  upstreamSecretKey: ""
  upstreamSecretKeyVersion: v1

app:
  enabled: true
  podAnnotations: {}
  replicaCount: 1
  strategy:
    maxUnavailable: 0
    maxSurge: 1
  # -- Seconds a newly ready app pod must stay ready before the rollout continues. Spacing the per-pod websocket drains keeps reconnecting clients from re-uploading their sessions all at once after a deploy; set 0 to disable the pause.
  minReadySeconds: 120
  # -- Total shutdown budget. Formula: max(drainTimeoutSeconds + 2 seconds RPC allowance + sleepSeconds, 2 seconds RPC allowance + sleepSeconds + drainTimeoutSeconds for the full in-VM fallback) + 10 seconds endpoint shutdown + 5 seconds margin.
  terminationGracePeriodSeconds: 120
  drainMarkerPath: /tmp/codex-pooler-draining
  startupProbe:
    enabled: true
    path: /healthz
    initialDelaySeconds: 5
    periodSeconds: 5
    failureThreshold: 12
    timeoutSeconds: 2
  lifecycle:
    preStop:
      enabled: true
      # -- Maximum seconds to wait for the websocket rollout drain RPC before continuing pod shutdown. The drain returns as soon as in-flight turns finish, so the budget is only consumed while a long turn is actually running; the default is sized so the effective wait (about 10 seconds under the budget) covers p99 in-flight turn durations instead of cutting at p95.
      drainTimeoutSeconds: 85
      # -- Seconds to keep the pod unready after the drain marker/RPC before Kubernetes sends SIGTERM.
      sleepSeconds: 10
  podDisruptionBudget:
    enabled: true
    minAvailable: 1
  service:
    # -- Arbitrary annotations for the app Service. Use the annotations supported by your ingress or load-balancer controller when browser-level cookie affinity is required during mixed-revision rolling updates.
    annotations: {}
    type: ClusterIP
    port: 4000
    # -- Kubernetes Service session affinity. ClientIP is useful for clients that reach the Service directly, but it is not a portable replacement for browser cookie affinity behind an ingress controller.
    sessionAffinity: None
    # -- Additional Kubernetes Service session-affinity settings. Set clientIP.timeoutSeconds only when sessionAffinity is ClientIP.
    sessionAffinityConfig: {}
  resources:
    requests:
      cpu: 100m
      memory: 512Mi
    # -- No CPU limit by default: the BEAM gateway must burst during
    # post-rollout reconnect storms (TLS + replay body decompression), and CFS
    # throttling there surfaces as client-visible 408 body-read timeouts. Set
    # a limit explicitly only if your platform requires one.
    limits:
      # -- Memory ceiling for the HTTP and long-lived WebSocket gateway process.
      memory: 2Gi
  nodeSelector: {}
  tolerations: []
  affinity: {}

migrations:
  enabled: true
  ttlSecondsAfterFinished: 300
  resources:
    requests:
      cpu: 50m
      memory: 192Mi
    limits:
      cpu: 250m
      memory: 384Mi

oban:
  worker:
    enabled: true
    podAnnotations: {}
    replicaCount: 1
    strategy:
      maxUnavailable: 0
      maxSurge: 1
    terminationGracePeriodSeconds: 75
    resources:
      requests:
        cpu: 75m
        memory: 768Mi
      limits:
        cpu: 500m
        memory: 768Mi
    nodeSelector: {}
    tolerations: []
    affinity: {}
  scheduler:
    enabled: true
    podAnnotations: {}
    replicaCount: 1
    strategy:
      maxUnavailable: 0
      maxSurge: 1
    terminationGracePeriodSeconds: 75
    resources:
      requests:
        cpu: 75m
        memory: 584Mi
      limits:
        cpu: 500m
        memory: 584Mi
    nodeSelector: {}
    tolerations: []
    affinity: {}
