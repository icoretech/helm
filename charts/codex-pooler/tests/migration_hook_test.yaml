suite: migration hook ordering
# Helm runs pre-install hooks before it applies the release manifests. The
# migration Job is such a hook and reads six keys from a Secret; when the chart
# creates that Secret itself it is a manifest, so on a fresh install with
# `secrets.create=true` the Job started before the Secret existed and the whole
# install failed with `secret "codex-pooler-secrets" not found`.
#
# Only a real `ct install` found that: the render is valid, every object is
# individually valid at the API server, and nothing about hook ordering is
# visible in either. These assertions pin the ordering so the race cannot come
# back between installs.
templates:
  - secret.yaml
  - migration-job.yaml
tests:
  - it: creates the Secret the migration hook reads inside the hook phase
    template: secret.yaml
    documentIndex: 1
    set:
      secrets.create: true
      secrets.databaseUrl: postgres://example-postgres/codex_pooler
      secrets.secretKeyBase: example-secret-key-base
      secrets.totpEncryptionKey: example-totp-key
      secrets.upstreamSecretKey: rrrrrrrrrrrrrrrrrrrrrrrrrrrrrrrr
    asserts:
      - isKind:
          of: Secret
      - equal:
          path: metadata.name
          value: codex-pooler-secrets-migrations
      - equal:
          path: metadata.annotations["helm.sh/hook"]
          value: pre-install,pre-upgrade
      # Lower than the Job's weight: Helm orders hooks within a phase by weight,
      # and this is the only thing that puts the Secret first.
      - equal:
          path: metadata.annotations["helm.sh/hook-weight"]
          value: "-10"
      - equal:
          path: metadata.annotations["helm.sh/hook-delete-policy"]
          value: before-hook-creation,hook-succeeded
      - equal:
          path: stringData["database-url"]
          value: postgres://example-postgres/codex_pooler

  - it: keeps the Secret the workloads mount in the release manifest
    template: secret.yaml
    documentIndex: 0
    set:
      secrets.create: true
      secrets.databaseUrl: postgres://example-postgres/codex_pooler
      secrets.secretKeyBase: example-secret-key-base
      secrets.totpEncryptionKey: example-totp-key
      secrets.upstreamSecretKey: rrrrrrrrrrrrrrrrrrrrrrrrrrrrrrrr
    asserts:
      - equal:
          path: metadata.name
          value: codex-pooler-secrets
      - notExists:
          path: metadata.annotations["helm.sh/hook"]

  - it: points the migration Job at the Secret created in its own phase
    template: migration-job.yaml
    set:
      secrets.create: true
      secrets.databaseUrl: postgres://example-postgres/codex_pooler
      secrets.secretKeyBase: example-secret-key-base
      secrets.totpEncryptionKey: example-totp-key
      secrets.upstreamSecretKey: rrrrrrrrrrrrrrrrrrrrrrrrrrrrrrrr
    asserts:
      - equal:
          path: metadata.annotations["helm.sh/hook"]
          value: pre-install,pre-upgrade
      - equal:
          path: metadata.annotations["helm.sh/hook-weight"]
          value: "0"
      - equal:
          path: spec.template.spec.containers[?(@.name=="migrations")].env[?(@.name=="DATABASE_URL")].valueFrom.secretKeyRef.name
          value: codex-pooler-secrets-migrations
      - equal:
          path: spec.template.spec.containers[?(@.name=="migrations")].env[?(@.name=="CODEX_POOLER_UPSTREAM_SECRET_KEY")].valueFrom.secretKeyRef.name
          value: codex-pooler-secrets-migrations

  - it: reads an operator-supplied Secret directly, because it already exists
    template: migration-job.yaml
    set:
      secrets.create: false
      secrets.existingSecret: codex-pooler-secrets
    asserts:
      - equal:
          path: spec.template.spec.containers[?(@.name=="migrations")].env[?(@.name=="DATABASE_URL")].valueFrom.secretKeyRef.name
          value: codex-pooler-secrets

  - it: renders no Secret at all when the operator supplies one
    template: secret.yaml
    set:
      secrets.create: false
      secrets.existingSecret: codex-pooler-secrets
    asserts:
      - hasDocuments:
          count: 0

  - it: renders no hook copy when there is no migration hook to feed
    template: secret.yaml
    set:
      migrations.enabled: false
      secrets.create: true
      secrets.databaseUrl: postgres://example-postgres/codex_pooler
      secrets.secretKeyBase: example-secret-key-base
      secrets.totpEncryptionKey: example-totp-key
      secrets.upstreamSecretKey: rrrrrrrrrrrrrrrrrrrrrrrrrrrrrrrr
    asserts:
      - hasDocuments:
          count: 1

  - it: bounds a migration that cannot finish
    template: migration-job.yaml
    asserts:
      # Without these a Job that can never start — a missing Secret key, an
      # unreachable database — stays active until the Helm client times out.
      - equal:
          path: spec.backoffLimit
          value: 3
      - equal:
          path: spec.activeDeadlineSeconds
          value: 900
