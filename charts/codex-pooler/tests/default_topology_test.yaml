suite: default topology
# `ci/install-values.yaml` disables the app, migrations, worker and scheduler,
# because `ct install` has no database or published image to install against.
# That is the only values file chart-testing uses, so `ct lint` and `ct install`
# validate a topology of one ServiceAccount: a template change that broke every
# workload would pass both.
#
# The default posture is what an operator actually deploys, and this suite is
# what asserts it renders. It stays deliberately structural — which objects
# exist, what selects what, which role each one runs — so that behaviour
# assertions keep living in the suites that own them.
templates:
  - app-deployment.yaml
  - ingress.yaml
  - app-pdb.yaml
  - app-service.yaml
  - migration-job.yaml
  - oban-scheduler-deployment.yaml
  - oban-worker-deployment.yaml
  - serviceaccount.yaml
tests:
  - it: renders the app Deployment on the web role
    template: app-deployment.yaml
    asserts:
      - isKind:
          of: Deployment
      - equal:
          path: metadata.labels["app.kubernetes.io/component"]
          value: app
      - equal:
          path: spec.selector.matchLabels["app.kubernetes.io/component"]
          value: app
      # Anchored by container name, not by index: a renamed container reddens
      # every assertion below with `unknown path`, and a legitimate sidecar
      # inserted ahead of it does not.
      - exists:
          path: spec.template.spec.containers[?(@.name=="app")]
      - equal:
          path: spec.template.spec.containers[?(@.name=="app")].env[?(@.name=="OBAN_MODE")].value
          value: web
      - equal:
          path: spec.template.spec.containers[?(@.name=="app")].env[?(@.name=="PHX_SERVER")].value
          value: "true"
      - equal:
          path: spec.template.spec.containers[?(@.name=="app")].ports[?(@.name=="http")].containerPort
          value: 4000

  - it: renders the app Service in front of the app Deployment
    template: app-service.yaml
    # The clustering headless Service renders from the same template, and path
    # assertions apply to every document: without this, enabling clustering
    # would red this test instead of the suite that owns clustering.
    documentIndex: 0
    asserts:
      - isKind:
          of: Service
      - equal:
          path: spec.selector["app.kubernetes.io/component"]
          value: app
      - equal:
          path: spec.ports[0].name
          value: http
      # The field that actually puts the Service in front of the container: a
      # number no container exposes renders a Service that routes nowhere.
      - equal:
          path: spec.ports[0].targetPort
          value: http

  - it: points the Ingress at the app Service and the port it publishes
    templates:
      - ingress.yaml
    set:
      ingress.enabled: true
    asserts:
      - isKind:
          of: Ingress
      # The same class of dangling reference as targetPort, one object further
      # out: a renamed backend leaves every object individually valid, and the
      # Ingress serving 503s.
      - equal:
          path: spec.rules[0].http.paths[0].backend.service.name
          value: codex-pooler-app
      - equal:
          path: spec.rules[0].http.paths[0].backend.service.port.name
          value: http

  - it: renders the app PodDisruptionBudget against the app selector
    template: app-pdb.yaml
    asserts:
      - isKind:
          of: PodDisruptionBudget
      - equal:
          path: spec.selector.matchLabels["app.kubernetes.io/component"]
          value: app
      - exists:
          path: spec.minAvailable

  - it: renders the ServiceAccount every workload runs as
    template: serviceaccount.yaml
    asserts:
      - isKind:
          of: ServiceAccount
      - equal:
          path: metadata.name
          value: codex-pooler

  - it: renders the migration Job as part of the release
    template: migration-job.yaml
    asserts:
      - isKind:
          of: Job
      # Not a hook: hooks run before the release manifests exist, so the Job
      # could not read a Secret this chart creates. tests/migration_job_test.yaml
      # owns that contract.
      - notExists:
          path: metadata.annotations["helm.sh/hook"]
      - equal:
          path: spec.template.spec.restartPolicy
          value: OnFailure

  - it: renders the Oban worker Deployment on the worker role
    template: oban-worker-deployment.yaml
    asserts:
      - isKind:
          of: Deployment
      - equal:
          path: spec.template.spec.containers[?(@.name=="oban-worker")].env[?(@.name=="OBAN_MODE")].value
          value: worker

  - it: renders the Oban scheduler Deployment on the scheduler role
    template: oban-scheduler-deployment.yaml
    asserts:
      - isKind:
          of: Deployment
      - equal:
          path: spec.template.spec.containers[?(@.name=="oban-scheduler")].env[?(@.name=="OBAN_MODE")].value
          value: scheduler

  - it: renders nothing for a workload its values disable
    set:
      app.enabled: false
      migrations.enabled: false
      oban.worker.enabled: false
      oban.scheduler.enabled: false
    asserts:
      - hasDocuments:
          count: 0
        template: app-deployment.yaml
      - hasDocuments:
          count: 0
        template: app-pdb.yaml
      - hasDocuments:
          count: 0
        template: app-service.yaml
      - hasDocuments:
          count: 0
        template: migration-job.yaml
      - hasDocuments:
          count: 0
        template: oban-worker-deployment.yaml
      - hasDocuments:
          count: 0
        template: oban-scheduler-deployment.yaml
      # What `ci/install-values.yaml` leaves chart-testing to validate.
      - hasDocuments:
          count: 1
        template: serviceaccount.yaml
