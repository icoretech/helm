suite: websocket topology guards
templates:
  - app-deployment.yaml
  - oban-worker-deployment.yaml
  - oban-scheduler-deployment.yaml
  - migration-job.yaml
tests:
  - it: rejects app replicaCount >= 2 unless clustering is enabled
    template: app-deployment.yaml
    set:
      app.replicaCount: 2
    asserts:
      - failedTemplate:
          errorMessage: "websocket owner forwarding requires clustering.enabled=true so websocket owner pods can be reached across app nodes"

  - it: rejects app replicaCount >= 2 unless app pods participate in clustering
    template: app-deployment.yaml
    set:
      app.replicaCount: 2
      clustering.enabled: true
      clustering.participants.app: false
    asserts:
      - failedTemplate:
          errorMessage: "websocket owner forwarding requires clustering.participants.app=true; worker or scheduler clustering cannot satisfy websocket owner forwarding"

  - it: automatically enables owner forwarding for clustered app replicaCount >= 2
    template: app-deployment.yaml
    set:
      app.replicaCount: 2
      clustering.enabled: true
    asserts:
      - equal:
          path: spec.replicas
          value: 2
      - equal:
          path: spec.template.spec.containers[?(@.name=="app")].env[?(@.name=="CODEX_POOLER_WEBSOCKET_OWNER_FORWARDING")].value
          value: "true"

  - it: rejects owner forwarding unless clustering is enabled
    template: app-deployment.yaml
    set:
      app.websocketContinuity.ownerForwarding.enabled: true
    asserts:
      - failedTemplate:
          errorMessage: "websocket owner forwarding requires clustering.enabled=true so websocket owner pods can be reached across app nodes"

  - it: rejects owner forwarding unless app nodes participate in clustering
    template: app-deployment.yaml
    set:
      clustering.enabled: true
      clustering.participants.app: false
      app.websocketContinuity.ownerForwarding.enabled: true
    asserts:
      - failedTemplate:
          errorMessage: "websocket owner forwarding requires clustering.participants.app=true; worker or scheduler clustering cannot satisfy websocket owner forwarding"

  - it: renders owner forwarding only on app pods
    template: app-deployment.yaml
    set:
      clustering.enabled: true
      app.websocketContinuity.ownerForwarding.enabled: true
    asserts:
      - equal:
          path: spec.template.spec.containers[?(@.name=="app")].env[?(@.name=="CODEX_POOLER_WEBSOCKET_OWNER_FORWARDING")].value
          value: "true"

  - it: does not render owner forwarding on worker pods
    template: oban-worker-deployment.yaml
    set:
      clustering.enabled: true
      app.websocketContinuity.ownerForwarding.enabled: true
    asserts:
      - notExists:
          path: spec.template.spec.containers[?(@.name=="oban-worker")].env[?(@.name=="CODEX_POOLER_WEBSOCKET_OWNER_FORWARDING")]

  - it: does not render owner forwarding on scheduler pods
    template: oban-scheduler-deployment.yaml
    set:
      clustering.enabled: true
      app.websocketContinuity.ownerForwarding.enabled: true
    asserts:
      - notExists:
          path: spec.template.spec.containers[?(@.name=="oban-scheduler")].env[?(@.name=="CODEX_POOLER_WEBSOCKET_OWNER_FORWARDING")]

  - it: does not render owner forwarding on migration pods
    template: migration-job.yaml
    set:
      clustering.enabled: true
      app.websocketContinuity.ownerForwarding.enabled: true
    asserts:
      - notExists:
          path: spec.template.spec.containers[?(@.name=="migrations")].env[?(@.name=="CODEX_POOLER_WEBSOCKET_OWNER_FORWARDING")]

  - it: renders clustering env for app pods
    template: app-deployment.yaml
    set:
      clustering.enabled: true
    asserts:
      - equal:
          path: spec.template.spec.containers[?(@.name=="app")].env[?(@.name=="DNS_CLUSTER_QUERY")].value
          value: codex-pooler-cluster.NAMESPACE.svc.cluster.local
      - equal:
          path: spec.template.spec.containers[?(@.name=="app")].env[?(@.name=="RELEASE_DISTRIBUTION")].value
          value: name
      - equal:
          path: spec.template.spec.containers[?(@.name=="app")].env[?(@.name=="RELEASE_COOKIE")].valueFrom.secretKeyRef.key
          value: release-cookie
      - equal:
          path: spec.template.spec.containers[?(@.name=="app")].env[?(@.name=="RELEASE_NODE")].value
          value: codex_pooler@$(POD_IP)
      - equal:
          path: spec.template.spec.subdomain
          value: codex-pooler-cluster

  - it: renders clustering env for worker pods
    template: oban-worker-deployment.yaml
    set:
      clustering.enabled: true
    asserts:
      - equal:
          path: spec.template.spec.containers[?(@.name=="oban-worker")].env[?(@.name=="DNS_CLUSTER_QUERY")].value
          value: codex-pooler-cluster.NAMESPACE.svc.cluster.local

  - it: renders clustering env for scheduler pods
    template: oban-scheduler-deployment.yaml
    set:
      clustering.enabled: true
    asserts:
      - equal:
          path: spec.template.spec.containers[?(@.name=="oban-scheduler")].env[?(@.name=="DNS_CLUSTER_QUERY")].value
          value: codex-pooler-cluster.NAMESPACE.svc.cluster.local

  - it: does not render clustering env for migration pods
    template: migration-job.yaml
    set:
      clustering.enabled: true
    asserts:
      - notExists:
          path: spec.template.spec.containers[?(@.name=="migrations")].env[?(@.name=="DNS_CLUSTER_QUERY")]

  - it: keeps http alongside the distribution ports on clustered app pods
    template: app-deployment.yaml
    set:
      clustering.enabled: true
    asserts:
      - equal:
          path: spec.template.spec.containers[?(@.name=="app")].env[?(@.name=="PHX_SERVER")].value
          value: "true"
      - equal:
          path: spec.template.spec.containers[?(@.name=="app")].ports[?(@.name=="http")].containerPort
          value: 4000
      - equal:
          path: spec.template.spec.containers[?(@.name=="app")].ports[?(@.name=="epmd")].containerPort
          value: 4369
      - equal:
          path: spec.template.spec.containers[?(@.name=="app")].ports[?(@.name=="distribution")].containerPort
          value: 9000
      - lengthEqual:
          path: spec.template.spec.containers[?(@.name=="app")].ports
          count: 3

  - it: keeps http off clustered app pods that do not participate in clustering
    template: app-deployment.yaml
    set:
      clustering.enabled: true
      clustering.participants.app: false
    asserts:
      - equal:
          path: spec.template.spec.containers[?(@.name=="app")].ports[?(@.name=="http")].containerPort
          value: 4000
      - notExists:
          path: spec.template.spec.containers[?(@.name=="app")].ports[?(@.name=="epmd")]
      - notExists:
          path: spec.template.spec.containers[?(@.name=="app")].ports[?(@.name=="distribution")]
      - lengthEqual:
          path: spec.template.spec.containers[?(@.name=="app")].ports
          count: 1

  - it: exposes only distribution ports and no PHX_SERVER on clustered worker pods
    template: oban-worker-deployment.yaml
    set:
      clustering.enabled: true
    asserts:
      - notExists:
          path: spec.template.spec.containers[?(@.name=="oban-worker")].env[?(@.name=="PHX_SERVER")]
      - notExists:
          path: spec.template.spec.containers[?(@.name=="oban-worker")].ports[?(@.name=="http")]
      - equal:
          path: spec.template.spec.containers[?(@.name=="oban-worker")].ports[?(@.name=="epmd")].containerPort
          value: 4369
      - equal:
          path: spec.template.spec.containers[?(@.name=="oban-worker")].ports[?(@.name=="distribution")].containerPort
          value: 9000
      - lengthEqual:
          path: spec.template.spec.containers[?(@.name=="oban-worker")].ports
          count: 2

  - it: exposes only distribution ports and no PHX_SERVER on clustered scheduler pods
    template: oban-scheduler-deployment.yaml
    set:
      clustering.enabled: true
    asserts:
      - notExists:
          path: spec.template.spec.containers[?(@.name=="oban-scheduler")].env[?(@.name=="PHX_SERVER")]
      - notExists:
          path: spec.template.spec.containers[?(@.name=="oban-scheduler")].ports[?(@.name=="http")]
      - equal:
          path: spec.template.spec.containers[?(@.name=="oban-scheduler")].ports[?(@.name=="epmd")].containerPort
          value: 4369
      - equal:
          path: spec.template.spec.containers[?(@.name=="oban-scheduler")].ports[?(@.name=="distribution")].containerPort
          value: 9000
      - lengthEqual:
          path: spec.template.spec.containers[?(@.name=="oban-scheduler")].ports
          count: 2

  - it: exposes no ports and no PHX_SERVER on clustered migration hook pods
    template: migration-job.yaml
    set:
      clustering.enabled: true
    asserts:
      - notExists:
          path: spec.template.spec.containers[?(@.name=="migrations")].env[?(@.name=="PHX_SERVER")]
      - notExists:
          path: spec.template.spec.containers[?(@.name=="migrations")].ports[?(@.name=="http")]
      - notExists:
          path: spec.template.spec.containers[?(@.name=="migrations")].ports
