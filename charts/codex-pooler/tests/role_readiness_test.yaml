suite: role readiness
# `helm install --wait` returned 0 and all three roles reported Ready against a
# database with no schema: the worker and scheduler Deployments carried no probe
# at all, so `kubectl rollout status` was not evidence that anything could work.
# Their readiness now asks the release itself, over the same rpc contract the
# app's preStop uses.
templates:
  - app-deployment.yaml
  - oban-worker-deployment.yaml
  - oban-scheduler-deployment.yaml
tests:
  - it: asks the worker release whether it can serve
    template: oban-worker-deployment.yaml
    asserts:
      # The whole command, not a substring: a probe commented out to an
      # unconditional `true` keeps a substring match green, which is exactly the
      # behaviour that shipped in 0.8.10.
      - equal:
          path: spec.template.spec.containers[?(@.name=="oban-worker")].readinessProbe.exec.command[2]
          value: 'ERL_AFLAGS= timeout 9s /app/bin/codex_pooler rpc "if Code.ensure_loaded?(CodexPooler.Release) and function_exported?(CodexPooler.Release, :readiness_check, 0), do: CodexPooler.Release.readiness_check(), else: ([_ | _] = Ecto.Adapters.SQL.query!(CodexPooler.Repo, ~s(select true from schema_migrations limit 1), []).rows)"'
      - equal:
          path: spec.template.spec.containers[?(@.name=="oban-worker")].readinessProbe.periodSeconds
          value: 30
      # Readiness only: restarting a container cannot apply a migration, so a
      # liveness or startup probe on this command would crash-loop the pod.
      - notExists:
          path: spec.template.spec.containers[?(@.name=="oban-worker")].livenessProbe
      - notExists:
          path: spec.template.spec.containers[?(@.name=="oban-worker")].startupProbe

  - it: asks the scheduler release whether it can serve
    template: oban-scheduler-deployment.yaml
    asserts:
      # The whole command, not a substring: a probe commented out to an
      # unconditional `true` keeps a substring match green, which is exactly the
      # behaviour that shipped in 0.8.10.
      - equal:
          path: spec.template.spec.containers[?(@.name=="oban-scheduler")].readinessProbe.exec.command[2]
          value: 'ERL_AFLAGS= timeout 9s /app/bin/codex_pooler rpc "if Code.ensure_loaded?(CodexPooler.Release) and function_exported?(CodexPooler.Release, :readiness_check, 0), do: CodexPooler.Release.readiness_check(), else: ([_ | _] = Ecto.Adapters.SQL.query!(CodexPooler.Repo, ~s(select true from schema_migrations limit 1), []).rows)"'
      - notExists:
          path: spec.template.spec.containers[?(@.name=="oban-scheduler")].livenessProbe
      - notExists:
          path: spec.template.spec.containers[?(@.name=="oban-scheduler")].startupProbe

  - it: checks the schema on images that do not export readiness_check/0
    template: oban-worker-deployment.yaml
    asserts:
      # Every image published so far takes this arm: readiness_check/0 exists
      # only in unreleased Pooler, and a wrapper that fell back to `:ok` made the
      # probe answer Ready without touching the database. The query raises when
      # the schema is absent, which is the only way an rpc can fail a probe.
      - matchRegex:
          path: spec.template.spec.containers[?(@.name=="oban-worker")].readinessProbe.exec.command[2]
          pattern: 'else: \(\[_ \| _\] = Ecto\.Adapters\.SQL\.query!\(CodexPooler\.Repo, ~s\(select true from schema_migrations limit 1\), \[\]\)\.rows\)"$'
      # function_exported?/3 answers false for a module that is merely not
      # loaded, which would take the fallback arm for the wrong reason.
      - matchRegex:
          path: spec.template.spec.containers[?(@.name=="oban-worker")].readinessProbe.exec.command[2]
          pattern: ^ERL_AFLAGS= timeout 9s /app/bin/codex_pooler rpc "if Code\.ensure_loaded\?\(CodexPooler\.Release\)

  - it: gives the app readiness probe a budget wider than the query it makes
    template: app-deployment.yaml
    asserts:
      - equal:
          path: spec.template.spec.containers[?(@.name=="app")].readinessProbe.httpGet.path
          value: /readyz
      # The kubelet default is 1s, which is the probe's own database timeout.
      - equal:
          path: spec.template.spec.containers[?(@.name=="app")].readinessProbe.timeoutSeconds
          value: 3
      - equal:
          path: spec.template.spec.containers[?(@.name=="app")].readinessProbe.failureThreshold
          value: 3

  - it: keeps the startup probe off the readiness endpoint
    template: app-deployment.yaml
    asserts:
      # /readyz depends on the database; a startup probe restarts the container,
      # so pointing it there turns an unmigrated database into a crash loop.
      - equal:
          path: spec.template.spec.containers[?(@.name=="app")].startupProbe.httpGet.path
          value: /healthz
