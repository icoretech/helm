# Values for the full-topology validation in pull-request CI, run by
# `.github/scripts/validate-rendered-topology.sh`.
#
# This is not a substitute for `ct install`: chart-testing installs this chart
# for real against `ci/fixtures/postgres.yaml`, which is the only thing that
# sees readiness, the migration running and the application actually starting.
# This file
# is the cheap, exhaustive half — every rendered object handed to the API
# server's own validation, including objects a failed install would never reach.
#
# It deliberately renders more than `ci/install-values.yaml`: clustering and an
# Ingress are off in the installed topology and still worth validating.
#
# ServiceMonitor stays disabled: its CRD is not installed in the CI cluster, and
# `tests/secrets_and_monitoring_test.yaml` owns that object's rendering.
image:
  tag: "0.0.1"

app:
  enabled: true
  replicaCount: 2
  podDisruptionBudget:
    enabled: true

migrations:
  enabled: true

oban:
  worker:
    enabled: true
  scheduler:
    enabled: true

clustering:
  enabled: true
  query: codex-pooler-cluster.default.svc.cluster.local
  headlessService:
    enabled: true
  cookie:
    value: sample-release-cookie

ingress:
  enabled: true
  className: nginx
  hosts:
    - host: codex-pooler.example.com
      paths:
        - path: /
          pathType: Prefix

secrets:
  create: true
  existingSecret: ""
  databaseUrl: postgres://codex_pooler:secret@example-postgres/codex_pooler
  secretKeyBase: sample-secret-key-base
  totpEncryptionKey: sample-totp-encryption-key
  totpKeyVersion: v1
  upstreamSecretKey: "01234567890123456789012345678901"
  upstreamSecretKeyVersion: v1
