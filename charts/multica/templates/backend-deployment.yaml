{{- include "multica.validate" . -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "multica.backendServiceName" . }}
  labels:
    {{- include "multica.labels" . | nindent 4 }}
    app.kubernetes.io/component: backend
spec:
  {{- if not .Values.backend.autoscaling.enabled }}
  replicas: {{ .Values.backend.replicaCount }}
  {{- end }}
  progressDeadlineSeconds: {{ .Values.backend.deployment.progressDeadlineSeconds }}
  strategy:
    type: {{ .Values.backend.deployment.strategy.type }}
  selector:
    matchLabels:
      {{- include "multica.componentSelectorLabels" (dict "root" . "component" "backend") | nindent 6 }}
  template:
    metadata:
      annotations:
        checksum/secret-refs: {{ include "multica.backendSecretChecksumInput" . | sha256sum }}
        checksum/feature-flags: {{ include "multica.featureFlagsChecksumInput" . | sha256sum }}
        {{- with .Values.backend.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      labels:
        {{- include "multica.componentSelectorLabels" (dict "root" . "component" "backend") | nindent 8 }}
        {{- with .Values.backend.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      terminationGracePeriodSeconds: {{ .Values.backend.deployment.terminationGracePeriodSeconds }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "multica.serviceAccountName" . }}
      securityContext:
        {{- toYaml .Values.backend.podSecurityContext | nindent 8 }}
      {{- if .Values.database.waitForReady.enabled }}
      initContainers:
        - name: wait-for-postgres
          image: {{ .Values.database.waitForReady.image | quote }}
          imagePullPolicy: {{ .Values.database.waitForReady.imagePullPolicy }}
          command:
            - /bin/sh
            - -ec
            - |
              start_ts="$(date +%s)"
              while true; do
                if nc -z "${DB_HOST}" "${DB_PORT}"; then
                  echo "Database is reachable at ${DB_HOST}:${DB_PORT}"
                  exit 0
                fi
                now_ts="$(date +%s)"
                elapsed="$((now_ts - start_ts))"
                if [ "$elapsed" -ge "${WAIT_TIMEOUT}" ]; then
                  echo "Timed out waiting for database at ${DB_HOST}:${DB_PORT} after ${WAIT_TIMEOUT}s"
                  exit 1
                fi
                echo "Waiting for database at ${DB_HOST}:${DB_PORT} (${elapsed}s elapsed)"
                sleep "${WAIT_PERIOD}"
              done
          env:
            - name: DB_HOST
              value: {{ include "multica.databaseHost" . | trim | quote }}
            - name: DB_PORT
              value: {{ include "multica.databasePort" . | trim | quote }}
            - name: WAIT_TIMEOUT
              value: {{ printf "%v" .Values.database.waitForReady.timeoutSeconds | quote }}
            - name: WAIT_PERIOD
              value: {{ printf "%v" .Values.database.waitForReady.periodSeconds | quote }}
      {{- end }}
      containers:
        - name: backend
          securityContext:
            {{- toYaml .Values.backend.securityContext | nindent 12 }}
          image: "{{ .Values.backend.image.repository }}:{{ .Values.backend.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.backend.image.pullPolicy }}
          env:
            {{- $managed := dict }}
            - name: PORT
              value: {{ printf "%v" .Values.backend.config.port | quote }}
            {{- $_ := set $managed "PORT" true }}
            - name: APP_ENV
              value: {{ .Values.backend.config.appEnv | quote }}
            {{- $_ := set $managed "APP_ENV" true }}
            - name: FRONTEND_ORIGIN
              value: {{ .Values.backend.config.frontendOrigin | quote }}
            {{- $_ := set $managed "FRONTEND_ORIGIN" true }}
            - name: MULTICA_APP_URL
              value: {{ default .Values.backend.config.frontendOrigin .Values.backend.config.appUrl | trimSuffix "/" | quote }}
            {{- $_ := set $managed "MULTICA_APP_URL" true }}
            - name: MULTICA_PUBLIC_URL
              value: {{ default .Values.backend.config.frontendOrigin .Values.backend.config.publicUrl | trimSuffix "/" | quote }}
            {{- $_ := set $managed "MULTICA_PUBLIC_URL" true }}
            {{- if .Values.database.external.urlFrom.secretKeyRef.name }}
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.database.external.urlFrom.secretKeyRef.name | quote }}
                  key: {{ required "multica: database.external.urlFrom.secretKeyRef.key is required" .Values.database.external.urlFrom.secretKeyRef.key | quote }}
            {{- else }}
            - name: DATABASE_URL
              value: {{ include "multica.databaseUrl" . | trim | quote }}
            {{- end }}
            {{- $_ := set $managed "DATABASE_URL" true }}
            {{- if .Values.database.pool.maxConns }}
            - name: DATABASE_MAX_CONNS
              value: {{ printf "%v" .Values.database.pool.maxConns | quote }}
            {{- end }}
            {{- $_ := set $managed "DATABASE_MAX_CONNS" true }}
            {{- if .Values.database.pool.minConns }}
            - name: DATABASE_MIN_CONNS
              value: {{ printf "%v" .Values.database.pool.minConns | quote }}
            {{- end }}
            {{- $_ := set $managed "DATABASE_MIN_CONNS" true }}
            {{- if .Values.realtime.redisUrlRef.name }}
            - name: REDIS_URL
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.realtime.redisUrlRef.name | quote }}
                  key: {{ required "multica: realtime.redisUrlRef.key is required" .Values.realtime.redisUrlRef.key | quote }}
            {{- else if .Values.realtime.redisUrl }}
            - name: REDIS_URL
              value: {{ .Values.realtime.redisUrl | quote }}
            {{- else if .Values.redis.enabled }}
              {{- if .Values.redis.auth.enabled }}
            - name: REDIS_URL
              valueFrom:
                secretKeyRef:
                  name: {{ include "multica.redis.fullname" . | quote }}
                  key: uri
              {{- else }}
            - name: REDIS_URL
              value: {{ include "multica.redis.unauthenticatedUrl" . | quote }}
              {{- end }}
            {{- end }}
            {{- $_ := set $managed "REDIS_URL" true }}
            {{- if .Values.realtime.redisDisableClientName }}
            - name: REDIS_DISABLE_CLIENT_NAME
              value: "true"
            {{- end }}
            {{- $_ := set $managed "REDIS_DISABLE_CLIENT_NAME" true }}
            {{- if .Values.realtime.relay.redisUrlRef.name }}
            - name: REALTIME_RELAY_REDIS_URL
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.realtime.relay.redisUrlRef.name | quote }}
                  key: {{ required "multica: realtime.relay.redisUrlRef.key is required when realtime.relay.redisUrlRef.name is set" .Values.realtime.relay.redisUrlRef.key | quote }}
            {{- else if .Values.realtime.relay.redisUrl }}
            - name: REALTIME_RELAY_REDIS_URL
              value: {{ .Values.realtime.relay.redisUrl | quote }}
            {{- end }}
            {{- $_ := set $managed "REALTIME_RELAY_REDIS_URL" true }}
            {{- if .Values.realtime.relay.mode }}
            - name: REALTIME_RELAY_MODE
              value: {{ .Values.realtime.relay.mode | quote }}
            {{- end }}
            {{- $_ := set $managed "REALTIME_RELAY_MODE" true }}
            {{- if ne (printf "%v" .Values.realtime.relay.shards) "<nil>" }}
            - name: REALTIME_RELAY_SHARDS
              value: {{ printf "%v" .Values.realtime.relay.shards | quote }}
            {{- end }}
            {{- $_ := set $managed "REALTIME_RELAY_SHARDS" true }}
            {{- if ne (printf "%v" .Values.realtime.relay.streamMaxLen) "<nil>" }}
            - name: REALTIME_RELAY_STREAM_MAXLEN
              value: {{ printf "%v" .Values.realtime.relay.streamMaxLen | quote }}
            {{- end }}
            {{- $_ := set $managed "REALTIME_RELAY_STREAM_MAXLEN" true }}
            {{- if ne (printf "%v" .Values.realtime.relay.xreadCount) "<nil>" }}
            - name: REALTIME_RELAY_XREAD_COUNT
              value: {{ printf "%v" .Values.realtime.relay.xreadCount | quote }}
            {{- end }}
            {{- $_ := set $managed "REALTIME_RELAY_XREAD_COUNT" true }}
            {{- if .Values.realtime.relay.xreadBlock }}
            - name: REALTIME_RELAY_XREAD_BLOCK
              value: {{ .Values.realtime.relay.xreadBlock | quote }}
            {{- end }}
            {{- $_ := set $managed "REALTIME_RELAY_XREAD_BLOCK" true }}
            {{- if .Values.realtime.relay.replayGrace }}
            - name: REALTIME_RELAY_REPLAY_GRACE
              value: {{ .Values.realtime.relay.replayGrace | quote }}
            {{- end }}
            {{- $_ := set $managed "REALTIME_RELAY_REPLAY_GRACE" true }}
            {{- if .Values.realtime.relay.trimHorizon }}
            - name: REALTIME_RELAY_TRIM_HORIZON
              value: {{ .Values.realtime.relay.trimHorizon | quote }}
            {{- end }}
            {{- $_ := set $managed "REALTIME_RELAY_TRIM_HORIZON" true }}
            {{- if .Values.realtime.relay.streamTtlEnabled }}
            - name: REALTIME_RELAY_STREAM_TTL_ENABLED
              value: "true"
            {{- end }}
            {{- $_ := set $managed "REALTIME_RELAY_STREAM_TTL_ENABLED" true }}
            {{- if .Values.realtime.relay.streamTtl }}
            - name: REALTIME_RELAY_STREAM_TTL
              value: {{ .Values.realtime.relay.streamTtl | quote }}
            {{- end }}
            {{- $_ := set $managed "REALTIME_RELAY_STREAM_TTL" true }}
            {{- if .Values.realtime.relay.ttlRefreshInterval }}
            - name: REALTIME_RELAY_TTL_REFRESH_INTERVAL
              value: {{ .Values.realtime.relay.ttlRefreshInterval | quote }}
            {{- end }}
            {{- $_ := set $managed "REALTIME_RELAY_TTL_REFRESH_INTERVAL" true }}
            {{- if .Values.realtime.relay.maintenanceInterval }}
            - name: REALTIME_RELAY_MAINTENANCE_INTERVAL
              value: {{ .Values.realtime.relay.maintenanceInterval | quote }}
            {{- end }}
            {{- $_ := set $managed "REALTIME_RELAY_MAINTENANCE_INTERVAL" true }}
            {{- if .Values.channelLeases.backend }}
            - name: CHANNEL_WS_LEASE_BACKEND
              value: {{ .Values.channelLeases.backend | quote }}
            {{- end }}
            {{- $_ := set $managed "CHANNEL_WS_LEASE_BACKEND" true }}
            {{- if .Values.channelLeases.redisUrlRef.name }}
            - name: CHANNEL_WS_LEASE_REDIS_URL
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.channelLeases.redisUrlRef.name | quote }}
                  key: {{ required "multica: channelLeases.redisUrlRef.key is required when channelLeases.redisUrlRef.name is set" .Values.channelLeases.redisUrlRef.key | quote }}
            {{- else if .Values.channelLeases.redisUrl }}
            - name: CHANNEL_WS_LEASE_REDIS_URL
              value: {{ .Values.channelLeases.redisUrl | quote }}
            {{- end }}
            {{- $_ := set $managed "CHANNEL_WS_LEASE_REDIS_URL" true }}
            {{- if .Values.channelLeases.namespace }}
            - name: CHANNEL_WS_LEASE_NAMESPACE
              value: {{ .Values.channelLeases.namespace | quote }}
            {{- end }}
            {{- $_ := set $managed "CHANNEL_WS_LEASE_NAMESPACE" true }}
            {{- if .Values.channelLeases.ttl }}
            - name: CHANNEL_WS_LEASE_TTL
              value: {{ .Values.channelLeases.ttl | quote }}
            {{- end }}
            {{- $_ := set $managed "CHANNEL_WS_LEASE_TTL" true }}
            {{- if .Values.channelLeases.renewInterval }}
            - name: CHANNEL_WS_LEASE_RENEW_INTERVAL
              value: {{ .Values.channelLeases.renewInterval | quote }}
            {{- end }}
            {{- $_ := set $managed "CHANNEL_WS_LEASE_RENEW_INTERVAL" true }}
            {{- if .Values.channelLeases.pollInterval }}
            - name: CHANNEL_WS_LEASE_POLL_INTERVAL
              value: {{ .Values.channelLeases.pollInterval | quote }}
            {{- end }}
            {{- $_ := set $managed "CHANNEL_WS_LEASE_POLL_INTERVAL" true }}
            {{- if .Values.channelLeases.errorRetryInterval }}
            - name: CHANNEL_WS_LEASE_ERROR_RETRY_INTERVAL
              value: {{ .Values.channelLeases.errorRetryInterval | quote }}
            {{- end }}
            {{- $_ := set $managed "CHANNEL_WS_LEASE_ERROR_RETRY_INTERVAL" true }}
            {{- if .Values.channelLeases.expirySafetyMargin }}
            - name: CHANNEL_WS_LEASE_EXPIRY_SAFETY_MARGIN
              value: {{ .Values.channelLeases.expirySafetyMargin | quote }}
            {{- end }}
            {{- $_ := set $managed "CHANNEL_WS_LEASE_EXPIRY_SAFETY_MARGIN" true }}
            {{- if .Values.backend.config.jwtSecretRef.name }}
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.backend.config.jwtSecretRef.name | quote }}
                  key: {{ required "multica: backend.config.jwtSecretRef.key is required" .Values.backend.config.jwtSecretRef.key | quote }}
            {{- else }}
            - name: JWT_SECRET
              value: {{ .Values.backend.config.jwtSecret | quote }}
            {{- end }}
            {{- $_ := set $managed "JWT_SECRET" true }}
            - name: CORS_ALLOWED_ORIGINS
              value: {{ .Values.backend.config.corsAllowedOrigins | quote }}
            {{- $_ := set $managed "CORS_ALLOWED_ORIGINS" true }}
            - name: ALLOWED_ORIGINS
              value: {{ .Values.backend.config.allowedOrigins | quote }}
            {{- $_ := set $managed "ALLOWED_ORIGINS" true }}
            - name: METRICS_ADDR
              value: {{ .Values.backend.config.metricsAddr | quote }}
            {{- $_ := set $managed "METRICS_ADDR" true }}
            {{- if .Values.backend.config.realtimeMetricsTokenRef.name }}
            - name: REALTIME_METRICS_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.backend.config.realtimeMetricsTokenRef.name | quote }}
                  key: {{ required "multica: backend.config.realtimeMetricsTokenRef.key is required" .Values.backend.config.realtimeMetricsTokenRef.key | quote }}
            {{- else if .Values.backend.config.realtimeMetricsToken }}
            - name: REALTIME_METRICS_TOKEN
              value: {{ .Values.backend.config.realtimeMetricsToken | quote }}
            {{- end }}
            {{- $_ := set $managed "REALTIME_METRICS_TOKEN" true }}
            {{- if .Values.backend.config.authTokenTtl }}
            - name: AUTH_TOKEN_TTL
              value: {{ .Values.backend.config.authTokenTtl | quote }}
            {{- end }}
            {{- $_ := set $managed "AUTH_TOKEN_TTL" true }}
            {{- if .Values.backend.config.databaseStartupTimeout }}
            - name: MULTICA_DATABASE_STARTUP_TIMEOUT
              value: {{ .Values.backend.config.databaseStartupTimeout | quote }}
            {{- end }}
            {{- $_ := set $managed "MULTICA_DATABASE_STARTUP_TIMEOUT" true }}
            {{- if .Values.backend.config.databaseConnectTimeout }}
            - name: MULTICA_DATABASE_CONNECT_TIMEOUT
              value: {{ .Values.backend.config.databaseConnectTimeout | quote }}
            {{- end }}
            {{- $_ := set $managed "MULTICA_DATABASE_CONNECT_TIMEOUT" true }}
            {{- if .Values.backend.config.cloud.url }}
            - name: MULTICA_CLOUD_URL
              value: {{ .Values.backend.config.cloud.url | quote }}
            {{- end }}
            {{- $_ := set $managed "MULTICA_CLOUD_URL" true }}
            {{- if .Values.backend.config.daemonServerUrl }}
            - name: MULTICA_DAEMON_SERVER_URL
              value: {{ .Values.backend.config.daemonServerUrl | quote }}
            {{- end }}
            {{- $_ := set $managed "MULTICA_DAEMON_SERVER_URL" true }}
            {{- if .Values.backend.config.shutdownHoldDuration }}
            - name: MULTICA_SHUTDOWN_HOLD_DURATION
              value: {{ .Values.backend.config.shutdownHoldDuration | quote }}
            {{- end }}
            {{- $_ := set $managed "MULTICA_SHUTDOWN_HOLD_DURATION" true }}
            {{- if .Values.backend.config.runtimeReconnectGrace }}
            - name: MULTICA_RUNTIME_RECONNECT_GRACE
              value: {{ .Values.backend.config.runtimeReconnectGrace | quote }}
            {{- end }}
            {{- $_ := set $managed "MULTICA_RUNTIME_RECONNECT_GRACE" true }}
            - name: MULTICA_VCS_INTEGRATION_ENABLED
              value: {{ printf "%v" .Values.backend.config.vcsIntegrationEnabled | quote }}
            {{- $_ := set $managed "MULTICA_VCS_INTEGRATION_ENABLED" true }}
            {{- if .Values.backend.config.trustedProxies }}
            - name: MULTICA_TRUSTED_PROXIES
              value: {{ .Values.backend.config.trustedProxies | quote }}
            {{- end }}
            {{- $_ := set $managed "MULTICA_TRUSTED_PROXIES" true }}
            - name: MULTICA_DEV_VERIFICATION_CODE
              value: {{ .Values.backend.config.devVerificationCode | quote }}
            {{- $_ := set $managed "MULTICA_DEV_VERIFICATION_CODE" true }}
            - name: ALLOW_SIGNUP
              value: {{ printf "%v" .Values.backend.config.allowSignup | quote }}
            {{- $_ := set $managed "ALLOW_SIGNUP" true }}
            - name: ALLOWED_EMAILS
              value: {{ .Values.backend.config.allowedEmails | quote }}
            {{- $_ := set $managed "ALLOWED_EMAILS" true }}
            - name: ALLOWED_EMAIL_DOMAINS
              value: {{ .Values.backend.config.allowedEmailDomains | quote }}
            {{- $_ := set $managed "ALLOWED_EMAIL_DOMAINS" true }}
            - name: DISABLE_WORKSPACE_CREATION
              value: {{ printf "%v" .Values.backend.config.disableWorkspaceCreation | quote }}
            {{- $_ := set $managed "DISABLE_WORKSPACE_CREATION" true }}
            - name: COOKIE_DOMAIN
              value: {{ .Values.backend.config.cookieDomain | quote }}
            {{- $_ := set $managed "COOKIE_DOMAIN" true }}
            - name: ANALYTICS_DISABLED
              value: {{ printf "%v" .Values.backend.config.analyticsDisabled | quote }}
            {{- $_ := set $managed "ANALYTICS_DISABLED" true }}
            - name: ANALYTICS_ENVIRONMENT
              value: {{ .Values.backend.config.analyticsEnvironment | quote }}
            {{- $_ := set $managed "ANALYTICS_ENVIRONMENT" true }}
            - name: POSTHOG_API_KEY
              value: {{ .Values.backend.config.posthogApiKey | quote }}
            {{- $_ := set $managed "POSTHOG_API_KEY" true }}
            - name: POSTHOG_HOST
              value: {{ .Values.backend.config.posthogHost | quote }}
            {{- $_ := set $managed "POSTHOG_HOST" true }}
            {{- if .Values.backend.email.resendApiKeyRef.name }}
            - name: RESEND_API_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.backend.email.resendApiKeyRef.name | quote }}
                  key: {{ required "multica: backend.email.resendApiKeyRef.key is required" .Values.backend.email.resendApiKeyRef.key | quote }}
            {{- else }}
            - name: RESEND_API_KEY
              value: {{ .Values.backend.email.resendApiKey | quote }}
            {{- end }}
            {{- $_ := set $managed "RESEND_API_KEY" true }}
            - name: RESEND_FROM_EMAIL
              value: {{ .Values.backend.email.resendFromEmail | quote }}
            {{- $_ := set $managed "RESEND_FROM_EMAIL" true }}
            {{- if .Values.backend.email.smtp.host }}
            - name: SMTP_HOST
              value: {{ .Values.backend.email.smtp.host | quote }}
            {{- end }}
            {{- $_ := set $managed "SMTP_HOST" true }}
            {{- if .Values.backend.email.smtp.host }}
            - name: SMTP_PORT
              value: {{ printf "%v" .Values.backend.email.smtp.port | quote }}
            {{- end }}
            {{- $_ := set $managed "SMTP_PORT" true }}
            {{- if .Values.backend.email.smtp.host }}
            {{- if .Values.backend.email.smtp.usernameRef.name }}
            - name: SMTP_USERNAME
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.backend.email.smtp.usernameRef.name | quote }}
                  key: {{ required "multica: backend.email.smtp.usernameRef.key is required" .Values.backend.email.smtp.usernameRef.key | quote }}
            {{- else if .Values.backend.email.smtp.username }}
            - name: SMTP_USERNAME
              value: {{ .Values.backend.email.smtp.username | quote }}
            {{- end }}
            {{- end }}
            {{- $_ := set $managed "SMTP_USERNAME" true }}
            {{- if .Values.backend.email.smtp.host }}
            {{- if .Values.backend.email.smtp.passwordRef.name }}
            - name: SMTP_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.backend.email.smtp.passwordRef.name | quote }}
                  key: {{ required "multica: backend.email.smtp.passwordRef.key is required" .Values.backend.email.smtp.passwordRef.key | quote }}
            {{- else if .Values.backend.email.smtp.password }}
            - name: SMTP_PASSWORD
              value: {{ .Values.backend.email.smtp.password | quote }}
            {{- end }}
            {{- end }}
            {{- $_ := set $managed "SMTP_PASSWORD" true }}
            {{- if .Values.backend.email.smtp.host }}
            - name: SMTP_TLS_INSECURE
              value: {{ printf "%v" .Values.backend.email.smtp.tlsInsecure | quote }}
            {{- end }}
            {{- $_ := set $managed "SMTP_TLS_INSECURE" true }}
            {{- if and .Values.backend.email.smtp.host .Values.backend.email.smtp.tls }}
            - name: SMTP_TLS
              value: {{ .Values.backend.email.smtp.tls | quote }}
            {{- end }}
            {{- $_ := set $managed "SMTP_TLS" true }}
            {{- if and .Values.backend.email.smtp.host .Values.backend.email.smtp.ehloName }}
            - name: SMTP_EHLO_NAME
              value: {{ .Values.backend.email.smtp.ehloName | quote }}
            {{- end }}
            {{- $_ := set $managed "SMTP_EHLO_NAME" true }}
            {{- if and .Values.backend.email.smtp.host .Values.backend.email.smtp.fromEmail }}
            - name: SMTP_FROM_EMAIL
              value: {{ .Values.backend.email.smtp.fromEmail | quote }}
            {{- end }}
            {{- $_ := set $managed "SMTP_FROM_EMAIL" true }}
            {{- if .Values.backend.google.clientIdRef.name }}
            - name: GOOGLE_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.backend.google.clientIdRef.name | quote }}
                  key: {{ required "multica: backend.google.clientIdRef.key is required" .Values.backend.google.clientIdRef.key | quote }}
            {{- else }}
            - name: GOOGLE_CLIENT_ID
              value: {{ .Values.backend.google.clientId | quote }}
            {{- end }}
            {{- $_ := set $managed "GOOGLE_CLIENT_ID" true }}
            {{- if .Values.backend.google.clientSecretRef.name }}
            - name: GOOGLE_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.backend.google.clientSecretRef.name | quote }}
                  key: {{ required "multica: backend.google.clientSecretRef.key is required" .Values.backend.google.clientSecretRef.key | quote }}
            {{- else }}
            - name: GOOGLE_CLIENT_SECRET
              value: {{ .Values.backend.google.clientSecret | quote }}
            {{- end }}
            {{- $_ := set $managed "GOOGLE_CLIENT_SECRET" true }}
            - name: GOOGLE_REDIRECT_URI
              value: {{ .Values.backend.google.redirectUri | quote }}
            {{- $_ := set $managed "GOOGLE_REDIRECT_URI" true }}
            {{- if .Values.backend.github.appSlug }}
            - name: GITHUB_APP_SLUG
              value: {{ .Values.backend.github.appSlug | quote }}
            {{- end }}
            {{- $_ := set $managed "GITHUB_APP_SLUG" true }}
            {{- if .Values.backend.github.webhookSecretRef.name }}
            - name: GITHUB_WEBHOOK_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.backend.github.webhookSecretRef.name | quote }}
                  key: {{ required "multica: backend.github.webhookSecretRef.key is required when backend.github.webhookSecretRef.name is set" .Values.backend.github.webhookSecretRef.key | quote }}
            {{- else if .Values.backend.github.webhookSecret }}
            - name: GITHUB_WEBHOOK_SECRET
              value: {{ .Values.backend.github.webhookSecret | quote }}
            {{- end }}
            {{- $_ := set $managed "GITHUB_WEBHOOK_SECRET" true }}
            {{- if .Values.backend.github.appId }}
            - name: GITHUB_APP_ID
              value: {{ .Values.backend.github.appId | quote }}
            {{- end }}
            {{- $_ := set $managed "GITHUB_APP_ID" true }}
            {{- if .Values.backend.github.appPrivateKeyRef.name }}
            - name: GITHUB_APP_PRIVATE_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.backend.github.appPrivateKeyRef.name | quote }}
                  key: {{ required "multica: backend.github.appPrivateKeyRef.key is required when backend.github.appPrivateKeyRef.name is set" .Values.backend.github.appPrivateKeyRef.key | quote }}
            {{- else if .Values.backend.github.appPrivateKey }}
            - name: GITHUB_APP_PRIVATE_KEY
              value: {{ .Values.backend.github.appPrivateKey | quote }}
            {{- end }}
            {{- $_ := set $managed "GITHUB_APP_PRIVATE_KEY" true }}
            {{- if .Values.backend.rateLimits.auth.maxPerMinute }}
            - name: RATE_LIMIT_AUTH
