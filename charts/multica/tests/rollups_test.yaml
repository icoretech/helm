suite: retired usage rollup read-path flags
templates:
  - backend-deployment.yaml
tests:
  - it: never renders the retired usage rollup read-path envs
    asserts:
      - notExists:
          path: spec.template.spec.containers[0].env[?(@.name=="USAGE_DAILY_ROLLUP_ENABLED")]
      - notExists:
          path: spec.template.spec.containers[0].env[?(@.name=="USAGE_DASHBOARD_ROLLUP_ENABLED")]

  - it: fails when backend.usageRollups.dailyEnabled is set
    set:
      backend.usageRollups.dailyEnabled: true
    asserts:
      - failedTemplate:
          errorMessage: "multica: backend.usageRollups.dailyEnabled/dashboardEnabled were removed upstream; the legacy daily and dashboard rollup tables were dropped and are no longer read"

  - it: fails when backend.usageRollups.dashboardEnabled is set
    set:
      backend.usageRollups.dashboardEnabled: true
    asserts:
      - failedTemplate:
          errorMessage: "multica: backend.usageRollups.dailyEnabled/dashboardEnabled were removed upstream; the legacy daily and dashboard rollup tables were dropped and are no longer read"
