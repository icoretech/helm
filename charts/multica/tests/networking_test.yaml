suite: ingress and httproute templates
templates:
  - serviceaccount.yaml
  - ingress.yaml
  - gatewayapi-httproute.yaml
tests:
  - it: renders ingress rules when enabled
    template: ingress.yaml
    values:
      - values/valid-ingress.yaml
    asserts:
      - equal:
          path: spec.rules[0].host
          value: multica.example.com
      - equal:
          path: spec.rules[0].http.paths[0].backend.service.port.number
          value: 8080
      - equal:
          path: spec.rules[0].http.paths[0].path
          value: /health

  - it: renders Gateway API HTTPRoute when enabled
    template: gatewayapi-httproute.yaml
    values:
      - values/valid-httproute.yaml
    asserts:
      - equal:
          path: spec.parentRefs[0].name
          value: shared-gateway
      - equal:
          path: spec.hostnames[0]
          value: multica.example.com
      - equal:
          path: spec.rules[0].backendRefs[0].port
          value: 8080
      - equal:
          path: spec.rules[0].matches[0].path.value
          value: /health
      - equal:
          path: spec.rules[1].backendRefs[0].port
          value: 80

  - it: rejects HTTPRoute without parentRefs
    template: serviceaccount.yaml
    values:
      - values/invalid-http-route-parents.yaml
    asserts:
      - failedTemplate:
          errorMessage: "multica: httpRoute.parentRefs is required when httpRoute.enabled=true"

  - it: keeps frontend OAuth callbacks more specific than backend auth routes in Ingress
    template: ingress.yaml
    values:
      - values/valid-ingress.yaml
    set:
      fullnameOverride: multica
    asserts:
      - equal:
          path: spec.rules[0].http.paths[?(@.path=="/auth")].backend.service.name
          value: multica-backend
      - equal:
          path: spec.rules[0].http.paths[?(@.path=="/auth/callback")].backend.service.name
          value: multica
      - equal:
          path: spec.rules[0].http.paths[?(@.path=="/auth/callback")].pathType
          value: Prefix
      - equal:
          path: spec.rules[0].http.paths[?(@.path=="/auth/hg-sso/callback")].backend.service.name
          value: multica

  - it: keeps frontend OAuth callback prefixes ahead of the frontend catch-all in HTTPRoute
    template: gatewayapi-httproute.yaml
    values:
      - values/valid-httproute.yaml
    set:
      fullnameOverride: multica
    asserts:
      - contains:
          path: spec.rules[1].matches
          content:
            path:
              type: PathPrefix
              value: /auth/callback
      - contains:
          path: spec.rules[1].matches
          content:
            path:
              type: PathPrefix
              value: /auth/hg-sso/callback
      - equal:
          path: spec.rules[1].backendRefs[0].name
          value: multica
