suite: current deployment config surfaces
templates:
  - backend-deployment.yaml
  - frontend-deployment.yaml

tests:
  - it: renders current server configuration knobs
    template: backend-deployment.yaml
    set:
      backend.config.databaseStartupTimeout: 3m
      backend.config.appUrl: https://app.example.com
      backend.config.databaseConnectTimeout: 5s
      backend.config.cloud.url: https://cloud.example.com
      backend.config.daemonServerUrl: https://daemon.example.com
      backend.config.shutdownHoldDuration: 10s
      backend.config.runtimeReconnectGrace: 3h
      backend.config.vcsIntegrationEnabled: true
      backend.vcs.secretKeyRef.name: integration-secrets
      backend.vcs.secretKeyRef.key: VCS
      backend.email.smtp.host: smtp.example.com
      backend.email.smtp.fromEmail: sender@example.com
      backend.rateLimits.invitation.actor10m: 10
      backend.rateLimits.invitation.workspace24h: 20
      backend.rateLimits.invitation.recipient24h: 30
      backend.wecom.mediaAllowCidrs: 10.0.0.0/8
      backend.wecom.trace: true
      backend.composio.callbackBaseUrl: https://app.example.com
      backend.llm.baseUrl: https://llm.example.com/v1
      backend.llm.defaultModel: example-model
      backend.llm.maxRetries: 2
      backend.plugins.surfaceOrigin: https://plugins.example.com
      backend.plugins.apiUrl: https://plugins.example.com/v1
      backend.plugins.dir: /app/plugins
      storage.s3.usePathStyle: "true"
    asserts:
      - equal:
          path: spec.template.spec.containers[0].env[?(@.name=="MULTICA_DATABASE_STARTUP_TIMEOUT")].value
          value: 3m
      - equal:
          path: spec.template.spec.containers[0].env[?(@.name=="MULTICA_APP_URL")].value
          value: https://app.example.com
      - equal:
          path: spec.template.spec.containers[0].env[?(@.name=="MULTICA_DATABASE_CONNECT_TIMEOUT")].value
          value: 5s
      - equal:
          path: spec.template.spec.containers[0].env[?(@.name=="MULTICA_CLOUD_URL")].value
          value: https://cloud.example.com
      - equal:
          path: spec.template.spec.containers[0].env[?(@.name=="MULTICA_DAEMON_SERVER_URL")].value
          value: https://daemon.example.com
      - equal:
          path: spec.template.spec.containers[0].env[?(@.name=="MULTICA_SHUTDOWN_HOLD_DURATION")].value
          value: 10s
      - equal:
          path: spec.template.spec.containers[0].env[?(@.name=="MULTICA_RUNTIME_RECONNECT_GRACE")].value
          value: 3h
      - equal:
          path: spec.template.spec.containers[0].env[?(@.name=="MULTICA_VCS_INTEGRATION_ENABLED")].value
          value: "true"
      - equal:
          path: spec.template.spec.containers[0].env[?(@.name=="SMTP_FROM_EMAIL")].value
          value: sender@example.com
      - equal:
          path: spec.template.spec.containers[0].env[?(@.name=="RATE_LIMIT_INVITATION_ACTOR_10M")].value
          value: "10"
      - equal:
          path: spec.template.spec.containers[0].env[?(@.name=="RATE_LIMIT_INVITATION_WORKSPACE_24H")].value
          value: "20"
      - equal:
          path: spec.template.spec.containers[0].env[?(@.name=="RATE_LIMIT_INVITATION_RECIPIENT_24H")].value
          value: "30"
      - equal:
          path: spec.template.spec.containers[0].env[?(@.name=="MULTICA_WECOM_MEDIA_ALLOW_CIDRS")].value
          value: 10.0.0.0/8
      - equal:
          path: spec.template.spec.containers[0].env[?(@.name=="MULTICA_WECOM_TRACE")].value
          value: "1"
      - equal:
          path: spec.template.spec.containers[0].env[?(@.name=="COMPOSIO_CALLBACK_BASE_URL")].value
          value: https://app.example.com
      - equal:
          path: spec.template.spec.containers[0].env[?(@.name=="MULTICA_LLM_BASE_URL")].value
          value: https://llm.example.com/v1
      - equal:
          path: spec.template.spec.containers[0].env[?(@.name=="MULTICA_LLM_DEFAULT_MODEL")].value
          value: example-model
      - equal:
          path: spec.template.spec.containers[0].env[?(@.name=="MULTICA_LLM_MAX_RETRIES")].value
          value: "2"
      - equal:
          path: spec.template.spec.containers[0].env[?(@.name=="MULTICA_PLUGIN_SURFACE_ORIGIN")].value
          value: https://plugins.example.com
      - equal:
          path: spec.template.spec.containers[0].env[?(@.name=="MULTICA_PLUGIN_API_URL")].value
          value: https://plugins.example.com/v1
      - equal:
          path: spec.template.spec.containers[0].env[?(@.name=="MULTICA_PLUGIN_DIR")].value
          value: /app/plugins
      - equal:
          path: spec.template.spec.containers[0].env[?(@.name=="S3_USE_PATH_STYLE")].value
          value: "true"

  - it: renders frontend runtime configuration and graceful shutdown settings
    template: frontend-deployment.yaml
    set:
      frontend.config.remoteApiUrl: https://api.example.com
      frontend.config.docsUrl: https://docs.example.com
      frontend.config.publicApiUrl: https://api.example.com
      frontend.config.publicWsUrl: wss://api.example.com/ws
    asserts:
      - equal:
          path: spec.template.spec.containers[0].env[?(@.name=="REMOTE_API_URL")].value
          value: https://api.example.com
      - equal:
          path: spec.template.spec.containers[0].env[?(@.name=="DOCS_URL")].value
          value: https://docs.example.com
      - equal:
          path: spec.template.spec.containers[0].env[?(@.name=="NEXT_PUBLIC_API_URL")].value
          value: https://api.example.com
      - equal:
          path: spec.template.spec.containers[0].env[?(@.name=="NEXT_PUBLIC_WS_URL")].value
          value: wss://api.example.com/ws

  - it: renders backend termination grace period
    template: backend-deployment.yaml
    set:
      backend.deployment.terminationGracePeriodSeconds: 90
    asserts:
      - equal:
          path: spec.template.spec.terminationGracePeriodSeconds
          value: 90

  - it: rejects incomplete new secret references
    template: backend-deployment.yaml
    set:
      backend.dingtalk.secretKeyRef.name: integration-secrets
    asserts:
      - failedTemplate:
          errorMessage: "multica: backend.dingtalk.secretKeyRef.key is required when backend.dingtalk.secretKeyRef.name is set"

  - it: rejects VCS enablement without an encryption key
    template: backend-deployment.yaml
    set:
      backend.config.vcsIntegrationEnabled: true
    asserts:
      - failedTemplate:
          errorMessage: "multica: backend.vcs.secretKey or backend.vcs.secretKeyRef.name is required when backend.config.vcsIntegrationEnabled=true"
