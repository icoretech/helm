tolgee:
  backEndUrl: https://api.example.com
  oauth2:
    browserExtensionEnabled: true
    browserExtensionRedirectUris:
    - https://extension.example.com/callback
    cliEnabled: false
    cliRedirectUris:
    - http://127.0.0.1:9876/callback
    cimdEnabled: true
    cimdAllowedHosts:
    - client.example.com
    - other.example.com
    grantRetentionDays: 0
  async:
    streaming:
      maxThreads: -2
      queueCapacity: -2
      keepAliveSeconds: 0
    background:
      maxThreads: 0
      keepAliveSeconds: 0
  rateLimits:
    lockWaitMs: 0
    maxConcurrentPerBucket: 0
