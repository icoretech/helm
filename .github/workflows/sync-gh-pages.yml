name: Sync README and ArtifactHub to gh-pages

on:
  push:
    branches: [ main ]
    paths:
      - README.md
      - artifacthub-repo.yml
      - signing/**
      - charts/**/README.md
      - charts/**/README.md.gotmpl
      - charts/**/Readme.md
      - charts/**/Readme.md.gotmpl
      - charts/**/Chart.yaml
      - charts/**/logo.*
  workflow_dispatch:

jobs:
  sync:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0

      - name: Configure Git
        run: |
          git config user.name "$GITHUB_ACTOR"
          git config user.email "$GITHUB_ACTOR@users.noreply.github.com"

      - name: Generate chart documentation
        run: |
          tool_dir="$(mktemp -d)"
          trap 'rm -rf "$tool_dir"' EXIT
          source .github/scripts/pinned-tools.sh
          install_helm_docs "$tool_dir/helm-docs"
          "$tool_dir/helm-docs" --chart-search-root=charts

      - name: Sync files into gh-pages
        shell: bash
        run: |
          set -euo pipefail
          ghp="$(mktemp -d)"
          trap 'rm -rf "$ghp"' EXIT
          remote_url="$(git remote get-url origin)"
          auth_header="$(git config --local --get http.https://github.com/.extraheader || true)"
          git clone --shared --no-checkout . "$ghp"
          git -C "$ghp" remote set-url origin "$remote_url"
          git -C "$ghp" config user.name "$GITHUB_ACTOR"
          git -C "$ghp" config user.email "$GITHUB_ACTOR@users.noreply.github.com"
          if [[ -n "$auth_header" ]]; then
            git -C "$ghp" config http.https://github.com/.extraheader "$auth_header"
          fi
          if git ls-remote --exit-code --heads origin gh-pages >/dev/null 2>&1; then
            git -C "$ghp" fetch origin gh-pages
            git -C "$ghp" checkout -B gh-pages origin/gh-pages
          else
            echo "gh-pages does not exist; creating orphan branch with minimal files"
            git -C "$ghp" checkout --orphan gh-pages
          fi

          cp -v README.md "$ghp/README.md"
          {
            echo "---";
            echo "layout: default";
            echo "title: iCoreTech Helm Charts Repository";
            echo "---";
            echo;
            cat README.md;
          } > "$ghp/index.md"
          echo "Wrote $ghp/index.md from README.md with front matter"
          cp -v artifacthub-repo.yml "$ghp/artifacthub-repo.yml"
          if [ -f signing/pgp-public-key.asc ]; then
            cp -v signing/pgp-public-key.asc "$ghp/pgp-public-key.asc"
          fi
          # We intentionally do NOT create .nojekyll because the site uses Jekyll to render index.md

          # Publish per-chart docs and logos for Pages
          shopt -s nullglob
          for d in charts/*; do
            chart_dir="${d#charts/}"
            [ -d "$d" ] || continue
            mkdir -p "$ghp/charts/${chart_dir}"
            # Copy README as index.md so /charts/<name>/ resolves
            if [ -f "$d/README.md" ]; then
              tmpfile=$(mktemp)
              # Strip markdownlint comments that can confuse some renderers
              sed '/^<!--\s*markdownlint/Id' "$d/README.md" > "$tmpfile"
              {
                echo "---";
                echo "layout: default";
                echo "title: ${chart_dir}";
                echo "---";
                echo;
                # Ensure a blank line before pipe tables after a Values heading
                awk 'prev~/^##[ ]*Values[ ]*$/ && $0 ~ /^\|/ {print ""} {print; prev=$0}' "$tmpfile"
              } > "$ghp/charts/${chart_dir}/index.md"
              rm -f "$tmpfile"
              echo "Wrote ghp/charts/${chart_dir}/index.md with front matter"
            fi
            # Copy logos if present
            for logo in "$d"/logo.*; do
              [ -f "$logo" ] || continue
              cp -v "$logo" "$ghp/charts/${chart_dir}/" || true
            done
          done

          pushd "$ghp" >/dev/null
          if [[ -n "$(git status --porcelain)" ]]; then
            git add README.md index.md artifacthub-repo.yml pgp-public-key.asc charts || true
            git commit -m "docs: sync README & artifacthub metadata from main"
            git fetch origin gh-pages
            git rebase origin/gh-pages
            git push origin gh-pages
          else
            echo "No changes to sync."
          fi
          popd >/dev/null
