name: Lint and Test Charts

on: pull_request

jobs:
  lint-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Helm
        uses: azure/setup-helm@v5.0.1

      - uses: actions/setup-python@v7.0.0
        with:
          python-version: '3.14'
          check-latest: true

      - name: Set up chart-testing
        uses: helm/chart-testing-action@v2.8.0

      - name: Run chart-testing (list-changed)
        id: list-changed
        run: |
          changed=$(ct list-changed --target-branch ${{ github.event.repository.default_branch }})
          if [[ -n "$changed" ]]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi
          {
            echo "charts<<CHANGED_CHARTS_EOF"
            echo "$changed"
            echo "CHANGED_CHARTS_EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Run chart-testing (lint)
        if: steps.list-changed.outputs.changed == 'true'
        run: |
          for attempt in 1 2 3; do
            if ct lint --target-branch ${{ github.event.repository.default_branch }}; then
              exit 0
            fi
            rc=$?
            if [[ "$attempt" -eq 3 ]]; then
              exit "$rc"
            fi
            sleep "$((attempt * 20))"
          done

      - name: Set up helm-unittest
        if: steps.list-changed.outputs.changed == 'true'
        run: |
          helm plugin install https://github.com/helm-unittest/helm-unittest \
            --version v0.5.1 \
            --verify=false

      - name: Run helm unittest (changed charts only)
        if: steps.list-changed.outputs.changed == 'true'
        env:
          CHANGED_CHARTS: ${{ steps.list-changed.outputs.charts }}
        run: |
          status=0
          while IFS= read -r chart; do
            [[ -n "$chart" ]] || continue
            if [[ ! -d "$chart/tests" ]]; then
              echo "::notice::skipping $chart (no tests directory)"
              continue
            fi
            echo "==> helm unittest $chart"
            if ! helm unittest "$chart"; then
              echo "::error::helm unittest failed for $chart"
              status=1
            fi
          done <<< "$CHANGED_CHARTS"
          exit "$status"

      - name: Create kind cluster
        if: steps.list-changed.outputs.changed == 'true'
        uses: helm/kind-action@v1.15.0

      - name: Run chart-testing (install)
        if: steps.list-changed.outputs.changed == 'true'
        run: |
          for attempt in 1 2 3; do
            if ct install --target-branch ${{ github.event.repository.default_branch }}; then
              exit 0
            fi
            rc=$?
            if [[ "$attempt" -eq 3 ]]; then
              exit "$rc"
            fi
            sleep "$((attempt * 20))"
          done
