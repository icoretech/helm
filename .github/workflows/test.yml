name: Lint and Test Charts

on: pull_request

permissions:
  contents: read

jobs:
  lint-test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Helm
        uses: azure/setup-helm@v5.0.1

      - uses: actions/setup-python@v7.0.0
        with:
          python-version: '3.14'
          check-latest: true

      - name: Set up chart-testing
        uses: helm/chart-testing-action@v2.8.0

      - name: Lint the CI definition
        run: .github/scripts/lint-ci.sh

      - name: Verify CI retry helper
        run: |
          .github/scripts/ct-retry-test.sh
          .github/scripts/verify-ci-gate.py
          .github/scripts/verify-ci-gate.py --self-test

      - name: Run chart-testing (list-changed)
        id: list-changed
        run: |
          changed=$(ct list-changed --target-branch ${{ github.event.repository.default_branch }})
          if [[ -n "$changed" ]]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi
          {
            echo "charts<<CHANGED_CHARTS_EOF"
            echo "$changed"
            echo "CHANGED_CHARTS_EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Verify chart change detection
        if: steps.list-changed.outputs.changed != 'true'
        run: |
          .github/scripts/assert-no-chart-changed.sh ${{ github.event.repository.default_branch }}

      - name: Run chart-testing (lint)
        if: steps.list-changed.outputs.changed == 'true'
        run: |
          .github/scripts/ct-retry.sh ct lint \
            --target-branch ${{ github.event.repository.default_branch }}

      - name: Check chart documentation is regenerated
        if: steps.list-changed.outputs.changed == 'true'
        env:
          CHANGED_CHARTS: ${{ steps.list-changed.outputs.charts }}
        run: |
          readarray -t charts <<< "$CHANGED_CHARTS"
          .github/scripts/check-chart-docs.sh "${charts[@]}"

      - name: Set up helm-unittest
        if: steps.list-changed.outputs.changed == 'true'
        run: |
          helm plugin install https://github.com/helm-unittest/helm-unittest \
            --version v0.5.1 \
            --verify=false

      - name: Run helm unittest (changed charts only)
        if: steps.list-changed.outputs.changed == 'true'
        env:
          CHANGED_CHARTS: ${{ steps.list-changed.outputs.charts }}
        run: |
          status=0
          while IFS= read -r chart; do
            [[ -n "$chart" ]] || continue
            if [[ ! -d "$chart/tests" ]]; then
              echo "::notice::skipping $chart (no tests directory)"
              continue
            fi
            echo "==> helm unittest $chart"
            if ! helm unittest "$chart"; then
              echo "::error::helm unittest failed for $chart"
              status=1
            fi
          done <<< "$CHANGED_CHARTS"
          exit "$status"

      - name: Create kind cluster
        if: steps.list-changed.outputs.changed == 'true'
        uses: helm/kind-action@v1.15.0

      - name: Validate the rendered topology against the API server
        if: steps.list-changed.outputs.changed == 'true'
        env:
          CHANGED_CHARTS: ${{ steps.list-changed.outputs.charts }}
        run: |
          readarray -t charts <<< "$CHANGED_CHARTS"
          .github/scripts/validate-rendered-topology.sh "${charts[@]}"

      - name: Apply chart-testing cluster fixtures
        if: steps.list-changed.outputs.changed == 'true'
        env:
          CHANGED_CHARTS: ${{ steps.list-changed.outputs.charts }}
        run: |
          readarray -t charts <<< "$CHANGED_CHARTS"
          .github/scripts/apply-ct-fixtures.sh "${charts[@]}"

      - name: Run chart-testing (install)
        if: steps.list-changed.outputs.changed == 'true'
        run: |
          .github/scripts/ct-retry.sh ct install \
            --target-branch ${{ github.event.repository.default_branch }} \
            --helm-extra-args '--timeout 600s --wait-for-jobs'
