name: metamcp e2e

on:
  pull_request:
    paths:
      - .github/workflows/metamcp-e2e.yaml
      - charts/metamcp/**
  push:
    branches: [ main ]
    paths:
      - .github/workflows/metamcp-e2e.yaml
      - charts/metamcp/**

concurrency:
  group: metamcp-e2e-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Setup Helm
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310
        with:
          version: v4.2.4
      - name: Setup kind
        uses: helm/kind-action@06c1ae10762d3b9c1644e7fe69596ae519e015a2
        with:
          version: v0.33.0
          kubectl_version: v1.37.1
      - name: Run metamcp e2e
        env:
          # helm/kind-action sets context to "kind-chart-testing" by default
          KUBE_CONTEXT: kind-chart-testing
          TIMEOUT: 6m
          E2E_PF: "false"
        run: |
          chmod +x charts/metamcp/hack/e2e.sh
          charts/metamcp/hack/e2e.sh
